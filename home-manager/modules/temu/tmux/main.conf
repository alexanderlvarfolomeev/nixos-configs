# --- General Settings ---
set -g mouse on               # Enable mouse support (scrolling, resizing)
set -g history-limit 102400   # Increase scrollback buffer size
set -g base-index 1           # Start window numbering at 1 instead of 0
setw -g pane-base-index 1     # Start pane numbering at 1

# --- Key Bindings ---
# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Easy config reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "{pane_current_path}"
bind - split-window -v -c "{pane_current_path}"
unbind '"'
unbind %

bind -n M-H previous-window
bind -n M-L next-window

# --- Appearance ---
set -g default-terminal "screen-256color" # Better color support
set -as terminal-features ",alacritty*:RGB"
